<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2A 排班</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2A排班">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#d9dde3; --ink:#1d2330; --mute:#6b7380; --acc:#1f6feb; --err:#c62828; --ok:#2e7d32;
          --D:#fff3c4; --E:#ffd9b3; --N:#cfd8ff; --R:#e3f4e3; --L:#f0e1f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 14px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  h1 { font-size:17px; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { font-size:13px; color:var(--mute); display:flex; gap:4px; align-items:center; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button { cursor:pointer; } button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  main { padding:10px 14px 80px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:12px; }
  .card h2 { font-size:15px; margin:0 0 8px; }
  .brushes { display:flex; flex-wrap:wrap; gap:6px; }
  .brushes button.on { outline:3px solid var(--acc); }
  .gridwrap { overflow:auto; max-height:70vh; border:1px solid var(--line); border-radius:8px; background:#fff; }
  table.grid { border-collapse:separate; border-spacing:0; font-size:12px; }
  .grid th, .grid td { border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-width:34px; height:34px; text-align:center; padding:0; }
  .grid th { position:sticky; top:0; background:#eef0f4; z-index:2; }
  .grid .name { position:sticky; left:0; background:#fff; z-index:1; min-width:86px; text-align:left; padding:0 6px; font-weight:600; }
  .grid th.name { z-index:3; background:#eef0f4; }
  .grid td.c { cursor:pointer; user-select:none; }
  .grid th.we, .grid td.we { background-image:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.05)); }
  .lend { background:#e0f2f1; color:#00695c; font-weight:600; }
  .D { background:var(--D); } .E { background:var(--E); } .N { background:var(--N); }
  .rest { background:var(--R); } .leave { background:var(--L); }
  .bad { box-shadow:inset 0 0 0 2px var(--err); }
  .cnt.bad { color:var(--err); font-weight:700; box-shadow:none; background:#fde8e8; }
  .cnt.good { color:var(--ok); }
  .grid td.auto { font-style:italic; opacity:.88; }
  .grid td.pre { box-shadow:inset 0 0 0 1px #8e44ad; }
  .issue { padding:6px 8px; border-left:4px solid var(--err); background:#fff5f5; margin:4px 0; font-size:13px; border-radius:4px; }
  .ok { padding:8px; background:#eef8ee; border-left:4px solid var(--ok); border-radius:4px; }
  .small { font-size:12px; color:var(--mute); }
  table.staff { width:100%; border-collapse:collapse; font-size:13px; }
  table.staff td, table.staff th { padding:4px; border-bottom:1px solid var(--line); text-align:left; }
  table.staff input[type=text] { width:90px; }
  details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>2A 排班原型 <span class="small">資料只存在這台裝置的瀏覽器，不會上傳</span></h1>
  <div class="row">
    <label>月份 <input type="month" id="month"></label>
    <label>本月應休 <input type="number" id="required" min="0" max="31" style="width:60px"></label>
    <label>平日放假日 <input type="text" id="holidays" placeholder="自動帶入" style="width:90px"></label>
    <span class="tabs row">
      <button data-mode="schedule" class="on">排班</button>
      <button data-mode="prebook">預假登記</button>
    </span>
  </div>
</header>
<main>
  <div class="card" id="prebookBar" hidden>
    <div class="row">
      <label>預設登記日 <input type="date" id="requestedAt"></label>
      <button id="applyPrebook">直接套用到班表（不審核）</button>
    </div>
    <div class="small">預假截止為排班月份前一個月的 8 號。每人的登記日填在「人員設定」，沒填就用預設登記日。登記完按「自動排班」，系統會依規則審核：當天人力不足時，特休優先，同類先登記者優先，其餘預假削減並由系統另排休息日。</div>
  </div>

  <div class="card" id="autoCard">
    <h2>自動排班</h2>
    <div class="small" style="margin-bottom:6px">依照每人本月班別、預假和已填的格子，排出建議班表。手動改過的格子會保留，只重排系統產生的部分。</div>
    <div class="row">
      <label>支援每人最多 <input type="number" id="supportMax" min="0" max="31" style="width:56px"> 天</label>
      <button id="autoRun" class="primary">自動排班</button>
      <button id="autoAgain">換一種排法</button>
      <button id="autoClear">清掉系統排的</button>
    </div>
    <div id="autoReport" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>畫筆 <span class="small">先選畫筆，再點格子</span></h2>
    <div class="brushes" id="brushes"></div>
    <div class="row" style="margin-top:8px">
      <button id="fillWork">未排的日子填上班</button>
      <button id="clearAll">清空本月</button>
    </div>
  </div>

  <div class="card">
    <h2 id="gridTitle">班表</h2>
    <div class="gridwrap"><table class="grid" id="grid"></table></div>
  </div>

  <div class="card"><h2>規則檢查</h2><div id="issues"></div></div>

  <div class="card">
    <details>
      <summary>人員設定</summary>
      <table class="staff" id="staffTable"></table>
      <div class="row" style="margin-top:8px"><button id="addStaff">新增人員</button></div>
      <div class="small">姓名請用代號（護士A）。「上月班別」用來檢查換班別時的交界休假。</div>
    </details>
  </div>

  <div class="card">
    <h2>資料</h2>
    <div class="row">
      <button id="exportJson">匯出 JSON</button>
      <button id="exportCsv">匯出 CSV</button>
      <label>匯入 <input type="file" id="importJson" accept=".json"></label>
    </div>
  </div>
</main>
<script src="rules.js"></script>
<script src="holidays.js"></script>
<script src="solver.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
